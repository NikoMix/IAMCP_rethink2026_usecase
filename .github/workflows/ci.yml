name: CI

on:
  # No branch filter: stacked pull requests target non-default branches.
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  SOLUTION: ProposalGenerator.slnx
  CONFIGURATION: Release
  TEST_RESULTS: ${{ github.workspace }}/TestResults

jobs:
  build-and-test:
    name: Build, lint and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up .NET (from global.json)
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Show SDK
        run: dotnet --version

      - name: Restore
        run: dotnet restore "$SOLUTION"

      - name: Build
        run: dotnet build "$SOLUTION" --no-restore --configuration "$CONFIGURATION"

      - name: Lint (dotnet format)
        run: dotnet format "$SOLUTION" --verify-no-changes --no-restore --verbosity minimal

      - name: Test
        run: >
          dotnet test "$SOLUTION"
          --no-build
          --configuration "$CONFIGURATION"
          --logger trx
          --results-directory "$TEST_RESULTS"

      - name: Fail if zero tests executed
        if: ${{ !cancelled() }}
        shell: pwsh
        run: ./.github/workflows/scripts/Assert-TestsExecuted.ps1 -ResultsDirectory "$env:TEST_RESULTS"

      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: ${{ env.TEST_RESULTS }}/**/*.trx
          if-no-files-found: warn
